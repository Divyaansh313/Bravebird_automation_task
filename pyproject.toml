[project]
name = "bravebird-automation-task"
version = "0.1.0"
description = "Playwright CLI: TOTP login, session reuse, nested form, document capture, JSON manifest"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "pyotp>=2.10.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
bravebird = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
